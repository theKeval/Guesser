plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.plugin.compose'
}

// Release version: single source of truth in /version.properties.
def versionProps = new Properties()
rootProject.file('version.properties').withInputStream { versionProps.load(it) }
def releaseVersionCode = versionProps.getProperty('VERSION_CODE', '').trim()
def releaseVersionName = versionProps.getProperty('VERSION_NAME', '').trim()
if (!(releaseVersionCode ==~ /[1-9]\d*/)) {
    throw new GradleException("version.properties: VERSION_CODE must be a positive integer, was '$releaseVersionCode'")
}
if (!(releaseVersionName ==~ /\d+\.\d+\.\d+/)) {
    throw new GradleException("version.properties: VERSION_NAME must be MAJOR.MINOR.PATCH, was '$releaseVersionName'")
}

// Play upload-key signing. Values come from ~/.gradle/gradle.properties or
// environment variables, never from this repository. Passwords should be given
// as *_PASSWORD_FILE paths so they never appear on a command line. Without
// these values, release builds are unsigned. See docs/releasing.md.
def signingValue = { String name ->
    providers.gradleProperty(name).orElse(providers.environmentVariable(name)).getOrNull()
}
def expandHome = { String path ->
    path?.startsWith('~/') ? System.getProperty('user.home') + path.substring(1) : path
}
def uploadStoreFile = expandHome(signingValue('NUMBCRUNCH_UPLOAD_STORE_FILE'))
def uploadStorePassword = signingValue('NUMBCRUNCH_UPLOAD_STORE_PASSWORD')
def uploadStorePasswordFile = expandHome(signingValue('NUMBCRUNCH_UPLOAD_STORE_PASSWORD_FILE'))
if (!uploadStorePassword && uploadStorePasswordFile) {
    uploadStorePassword = file(uploadStorePasswordFile).text.trim()
}
def uploadKeyAlias = signingValue('NUMBCRUNCH_UPLOAD_KEY_ALIAS') ?: 'numbcrunch-upload'
def uploadKeyPassword = signingValue('NUMBCRUNCH_UPLOAD_KEY_PASSWORD')
def uploadKeyPasswordFile = expandHome(signingValue('NUMBCRUNCH_UPLOAD_KEY_PASSWORD_FILE'))
if (!uploadKeyPassword && uploadKeyPasswordFile) {
    uploadKeyPassword = file(uploadKeyPasswordFile).text.trim()
}
uploadKeyPassword = uploadKeyPassword ?: uploadStorePassword
def hasUploadSigning = uploadStoreFile && uploadStorePassword

base {
    archivesName = "numbcrunch-$releaseVersionName-$releaseVersionCode"
}

android {
    namespace = "io.keval.apps.numbcrunch"
    compileSdk = 36

    defaultConfig {
        applicationId = "io.keval.apps.numbcrunch"
        minSdk = 21
        targetSdk = 36
        versionCode = releaseVersionCode.toInteger()
        versionName = releaseVersionName
        vectorDrawables.useSupportLibrary = true

        testInstrumentationRunner = "androidx.test.runner.AndroidJUnitRunner"
    }

    buildFeatures {
        compose = true
    }

    signingConfigs {
        if (hasUploadSigning) {
            upload {
                storeFile = file(uploadStoreFile)
                storePassword = uploadStorePassword
                keyAlias = uploadKeyAlias
                keyPassword = uploadKeyPassword
                storeType = uploadStoreFile.toLowerCase().endsWith('.jks') ? 'jks' : 'pkcs12'
            }
        }
    }

    buildTypes {
        release {
            if (hasUploadSigning) {
                signingConfig = signingConfigs.upload
            }
            minifyEnabled = false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile).configureEach {
    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    implementation project(':core-ui')
    implementation project(':data')
    implementation project(':domain')
    implementation project(':gameplay')

    implementation "androidx.core:core-ktx:$version_core"
    implementation "androidx.activity:activity-compose:$version_activity_compose"
    implementation "androidx.lifecycle:lifecycle-runtime-ktx:$version_lifecycle"
    implementation "androidx.navigation:navigation-compose:$version_navigation_compose"
    implementation "androidx.compose.ui:ui:$version_compose_ui"
    implementation "androidx.compose.ui:ui-tooling-preview:$version_compose_ui"
    implementation "androidx.compose.material3:material3:$version_compose_material3"
    implementation "androidx.compose.material:material-icons-extended:$version_compose_ui"
    implementation "com.google.android.material:material:$version_material"

    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.3.0'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.7.0'
    androidTestImplementation "androidx.compose.ui:ui-test-junit4:$version_compose_ui"
    debugImplementation "androidx.compose.ui:ui-tooling:$version_compose_ui"
    debugImplementation "androidx.compose.ui:ui-test-manifest:$version_compose_ui"
}

tasks.register('printReleaseVersion') {
    group = 'release'
    description = 'Prints the NumbCrunch version and whether upload signing is configured.'
    def summary = "versionCode=$releaseVersionCode versionName=$releaseVersionName " +
            "uploadSigning=${hasUploadSigning ? 'configured' : 'missing'}"
    doLast { println summary }
}

tasks.matching { it.name in ['bundleRelease', 'assembleRelease'] }.configureEach {
    def signed = hasUploadSigning
    doFirst {
        if (!signed) {
            logger.warn('WARNING: NumbCrunch upload signing is not configured; this release output is UNSIGNED ' +
                    'and Google Play will reject it. See docs/releasing.md.')
        }
    }
}
