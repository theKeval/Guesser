# NumbCrunch (:numbcrunch) release version. This file is the single source of
# truth; numbcrunch/build.gradle reads it. See docs/releasing.md.
#
# VERSION_CODE  Integer read by Google Play. Must be higher than every version
#               code ever uploaded to Play, on any track. Increment by 1.
# VERSION_NAME  Player-visible semantic version, MAJOR.MINOR.PATCH. Shown in
#               the Play listing and the in-app About screen.
#
# Do not reuse or lower either value. Guesser V1 (:guesser_v1) is versioned
# separately in app/build.gradle and is not published.
VERSION_CODE=2
VERSION_NAME=1.0.1
